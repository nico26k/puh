<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fishing Game Template</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1e2d; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9; height: auto; display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
/* =====================================================================
   FISHING GAME TEMPLATE — first-person, one continuous scene
   ---------------------------------------------------------------------
   You never leave the boat view. The lake bed and the fish are generated
   procedurally and seen *through* the water (refraction + absorption).

   Controls:  Move mouse / ← → keys           -> aim the cast
              Hold SPACE / mouse / touch       -> charge cast, release to cast
              Watch fish near the bobber: they get curious, nibble, then BITE
              Press when a fish bites (!)      -> hook it  (press too early = spook it)
              Hold to reel, release to ease tension (don't snap the line!)
              J -> journal,  R -> reset save
   Structure:
     1. CONFIG       – tune numbers here
     2. FISH         – fish table (add your own species)
     3. STATE        – game state + save/load
     4. INPUT        – unified keyboard / mouse / touch
     5. WORLD        – seeded noise, lake-bed depth, chunk-based fish spawning
     6. CAMERA       – perspective projection, follow camera
     7. FISH AI      – wander → curious → hover → nibble → bite → holding / flee
     8. UPDATE       – state machine
                       IDLE → CHARGING → CASTING → WAITING → BITE → REELING → RESULT
                                                      ↘ LOST (spooked / escaped) ↙
     9. DRAW         – sky, water shader (with lake bed), fish, boat, HUD
    10. HOOKS        – onFishCaught / onFishLost: plug in sounds, shop, quests…
   ===================================================================== */

// ---------- 1. CONFIG ----------
const CONFIG = {
  W: 960, H: 540,
  horizonY: 220,
  camera: { focal: 560, height: 112, nearZ: 150, followDist: 175 },
  aimSpread: 0.6,
  cast: { chargeSpeed: 1.2, minDist: 100, maxDist: 680, flightTime: 1.2 },
  waitTime: [1.0, 3.5],          // seconds until a nearby fish gets curious
  nibbles: [1, 3],               // test-nibbles before the real bite
  biteWindow: 0.9,               // seconds to react once a fish bites
  reel: { speed: 110, tensionUp: 0.45, tensionDown: 0.6, slackLimit: 2.5, catchDist: 60 },
  world: {
    seed: Math.floor(Math.random() * 1e9),   // new lake every page load — set a number to fix it
    chunk: 220,                  // fish are generated per square chunk of lake
    fishPerChunk: [0, 2],
    hookDepth: 25,
    interestRadius: 220,         // fish closer than this can notice the bait
  },
  look: {                        // free-look: right-drag, WASD, or F to lock the mouse
    sensitivity: 0.005,          // radians per pixel of mouse movement
    keySpeed: 1.6,               // radians per second with WASD
    maxYaw: 1.3, minPitch: -0.5, maxPitch: 0.75,
  },
  peek: {                        // "look under the water" view (E / ↓ / button)
    focal: 520,
    behind: 110,                 // how far behind the bait the underwater camera sits
    fadeSpeed: 3,
  },
};

// ---------- 2. FISH ----------
// weight = bite chance · minDist = lives at least this far out · strength = 0..1 fight
// speed = swim speed · pattern = 'stripes' | 'whiskers' | 'spots' | null
const FISH = [
  { id: 'minnow',  name: 'Minnow',      color: '#b9c9d4', weight: 40, minDist: 0,   size: [3, 6],   value: 2,  strength: 0.20, speed: 60, pattern: null },
  { id: 'perch',   name: 'Perch',       color: '#d6b23e', weight: 30, minDist: 150, size: [8, 14],  value: 6,  strength: 0.35, speed: 50, pattern: 'stripes' },
  { id: 'bass',    name: 'Bass',        color: '#5f8f4c', weight: 18, minDist: 300, size: [12, 22], value: 12, strength: 0.50, speed: 45, pattern: null },
  { id: 'catfish', name: 'Catfish',     color: '#7d6a58', weight: 10, minDist: 420, size: [18, 35], value: 20, strength: 0.65, speed: 32, pattern: 'whiskers' },
  { id: 'goldfin', name: 'Goldfin Koi', color: '#ff9f3a', weight: 3,  minDist: 550, size: [20, 30], value: 60, strength: 0.85, speed: 40, pattern: 'spots' },
];

// ---------- 3. STATE ----------
const SAVE_KEY = 'fishing-template-save';
const game = {
  state: 'IDLE', time: 0, stateTime: 0,
  coins: 0, caught: {}, best: {},
  aim: 0, castAim: 0,
  power: 0, powerDir: 1,
  castDist: 0, castX: 0,
  cam: { x: 0, z: 0, h: CONFIG.camera.height },
  bobber: { x: 0, y: 0, s: 1 },        // screen position of the bobber
  bob: { X: 0, Z: 0 },                 // world position of the bobber
  hookW: { X: 0, Z: 0, depth: 25 },    // world position of hook + bait
  dip: 0,
  ripples: [], splash: [],
  fishes: [], engaged: null, waitTimer: 0,
  fish: null, lineDist: 0, driftX: 0, tension: 0, slack: 0,
  pull: 0, pullDir: 1, pullTimer: 0, reelSpin: 0,
  message: '', messageTimer: 0,
  lastCatch: null, journalOpen: false,
  look: { yaw: 0, pitch: 0, dragging: false, locked: false, lx: 0, ly: 0, recenter: false },
  // underwater look
  peek: 0, peekTarget: 0,
  ucam: { X: 0, Z: 0, depth: 20 },
  bubbles: [],
  motes: Array.from({ length: 70 }, () => ({ x: Math.random() * 960, y: Math.random() * 540, s: 0.5 + Math.random() * 1.5 })),
};
const PEEK_STATES = ['WAITING', 'BITE', 'REELING', 'LOST'];
const canPeek = () => PEEK_STATES.includes(game.state);
function togglePeek() { if (canPeek()) game.peekTarget = game.peekTarget ? 0 : 1; }

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ coins: game.coins, caught: game.caught, best: game.best })); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d) Object.assign(game, { coins: d.coins || 0, caught: d.caught || {}, best: d.best || {} });
  } catch (e) {}
}
function resetSave() { game.coins = 0; game.caught = {}; game.best = {}; save(); toast('Save reset'); }
function setState(s) { game.state = s; game.stateTime = 0; }
function toast(msg, t = 2.2) { game.message = msg; game.messageTimer = t; }

// ---------- 4. INPUT ----------
const input = { down: false, pressed: false, released: false, left: false, right: false, keys: {} };
function press()   { if (!input.down) { input.down = true; input.pressed = true; } }
function release() { if (input.down)  { input.down = false; input.released = true; } }

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const L = game.look;
  if (e.button === 2) {                 // right mouse: drag to look around
    L.dragging = true; L.lx = e.clientX; L.ly = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  if (e.button !== 0) return;
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX - r.left) / r.width * CONFIG.W, cy = (e.clientY - r.top) / r.height * CONFIG.H;
  const btn = PEEK_BUTTON;
  if (canPeek() && cx >= btn.x && cx <= btn.x + btn.w && cy >= btn.y && cy <= btn.y + btn.h) { togglePeek(); return; }
  aimFromPointer(e); press();
});
canvas.addEventListener('pointermove', e => {
  const L = game.look;
  if (L.dragging) { lookBy(e.clientX - L.lx, e.clientY - L.ly); L.lx = e.clientX; L.ly = e.clientY; return; }
  aimFromPointer(e);
});
window.addEventListener('pointerup', e => { if (e.button === 2) game.look.dragging = false; else release(); });
window.addEventListener('pointercancel', () => { game.look.dragging = false; release(); });
document.addEventListener('mousemove', e => { if (game.look.locked) lookBy(e.movementX, e.movementY); });
document.addEventListener('pointerlockchange', () => { game.look.locked = document.pointerLockElement === canvas; });
function lookBy(dx, dy) {
  const L = game.look, K = CONFIG.look;
  L.recenter = false;
  L.yaw = clamp(L.yaw + dx * K.sensitivity, -K.maxYaw, K.maxYaw);
  L.pitch = clamp(L.pitch + dy * K.sensitivity, K.minPitch, K.maxPitch);
}
function togglePointerLock() {
  const fail = () => toast('Mouse lock is not available here — use right-drag or WASD');
  try {
    if (document.pointerLockElement === canvas) document.exitPointerLock();
    else { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(fail); }
  } catch (err) { fail(); }
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); }
  if (e.code === 'ArrowLeft') input.left = true;
  if (e.code === 'ArrowRight') input.right = true;
  if (e.code === 'KeyJ') game.journalOpen = !game.journalOpen;
  if ((e.code === 'KeyE' || e.code === 'ArrowDown') && !e.repeat) { e.preventDefault(); togglePeek(); }
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) input.keys[e.code] = true;
  if (e.code === 'KeyF' && !e.repeat) togglePointerLock();
  if (e.code === 'KeyC') game.look.recenter = true;
  if (e.code === 'KeyR' && !e.repeat) resetSave();
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') release();
  if (e.code === 'ArrowLeft') input.left = false;
  if (e.code === 'ArrowRight') input.right = false;
  if (input.keys[e.code]) input.keys[e.code] = false;
});
function aimFromPointer(e) {
  if (game.state !== 'IDLE' && game.state !== 'CHARGING') return;
  const r = canvas.getBoundingClientRect();
  game.aim = clamp(((e.clientX - r.left) / r.width - 0.5) * 2.4, -1, 1);
}

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(hex, to, k) { const a = hexRgb(hex), b = hexRgb(to); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',')})`; }
function pickWeighted(list, w = x => x.weight, rng = Math.random) {
  const total = list.reduce((s, x) => s + w(x), 0);
  let r = rng() * total;
  for (const x of list) { if ((r -= w(x)) <= 0) return x; }
  return list[0];
}
const pickFish = (dist, rng = Math.random) => pickWeighted(FISH.filter(f => dist >= f.minDist), x => x.weight, rng);

// ---------- 5. WORLD (procedural) ----------
const SEED = CONFIG.world.seed | 0;
function hash2(ix, iz) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + SEED) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z) {                 // smooth value noise, 0..1
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Lake-bed depth: shallow near the boat, deeper further out, with hills & holes
function bedDepth(X, Z) {
  return clamp(22 + Math.max(0, Z) * 0.1 + (vnoise(X * 0.005, Z * 0.005) - 0.5) * 40, 6, 120);
}

// Fish live in chunks. A chunk is generated (deterministically from the seed)
// when the camera can see it, and removed again when it is out of view.
const loadedChunks = new Set();
function updateChunks() {
  const W = CONFIG.world, cam = game.cam, S = W.chunk;
  const z0 = Math.max(0, Math.floor(cam.z / S)), z1 = Math.floor((cam.z + 900) / S);
  const x0 = Math.floor((cam.x - 700) / S), x1 = Math.floor((cam.x + 700) / S);
  const want = new Set();
  for (let cz = z0; cz <= z1; cz++) for (let cx = x0; cx <= x1; cx++) {
    const key = cx + ',' + cz; want.add(key);
    if (!loadedChunks.has(key)) { loadedChunks.add(key); spawnChunk(cx, cz, key); }
  }
  for (const key of loadedChunks) if (!want.has(key)) {
    loadedChunks.delete(key);
    game.fishes = game.fishes.filter(f => f.chunk !== key || f === game.engaged);
  }
}
function spawnChunk(cx, cz, key) {
  const S = CONFIG.world.chunk, rng = mulberry32(Math.floor(hash2(cx * 7 + 3, cz * 13 + 5) * 4294967296));
  const [lo, hi] = CONFIG.world.fishPerChunk, n = lo + Math.floor(rng() * (hi - lo + 1));
  for (let i = 0; i < n; i++) {
    const X = (cx + rng()) * S, Z = (cz + rng()) * S;
    if (Z < 40) continue;
    game.fishes.push(makeFish(pickFish(Z, rng), X, Z, rng, key));
  }
}
function makeFish(sp, X, Z, rng, chunk) {
  const size = +(sp.size[0] + rng() * (sp.size[1] - sp.size[0])).toFixed(1);
  const f = {
    sp, size, len: 8 + size * 1.4, X, Z, depth: 6 + rng() * 20, tDepth: 10,
    heading: rng() * Math.PI * 2, cur: 0, phase: rng() * 6,
    mode: 'wander', target: { X, Z }, timer: rng() * 3, home: { X, Z }, chunk,
    fv: { x: 1, z: 0 }, nibblesLeft: 0,
  };
  newWanderTarget(f);
  return f;
}

// ---------- 6. CAMERA ----------
// World: X = sideways, Z = distance out from the boat, Y = height (negative = underwater)
// Camera basis from free-look yaw/pitch (right, up, forward vectors in world space)
const CB = { rx: 1, rz: 0, ux: 0, uy: 1, uz: 0, fx: 0, fy: 0, fz: 1 };
function updateBasis() {
  const y = game.look.yaw, p = game.look.pitch, sy = Math.sin(y), cy = Math.cos(y), sp = Math.sin(p), cp = Math.cos(p);
  CB.rx = cy; CB.rz = -sy;
  CB.fx = sy * cp; CB.fy = -sp; CB.fz = cy * cp;
  CB.ux = sy * sp; CB.uy = cp; CB.uz = cy * sp;
}
function project(X, Z, Y = 0) {
  const { focal, nearZ } = CONFIG.camera, cam = game.cam;
  const ax = X - cam.x, ay = Y - cam.h, az = Z - cam.z + nearZ;
  const xc = ax * CB.rx + az * CB.rz, yc = ax * CB.ux + ay * CB.uy + az * CB.uz, z0 = ax * CB.fx + ay * CB.fy + az * CB.fz;
  const z = Math.max(1, z0);
  return { x: CONFIG.W / 2 + xc * focal / z, y: CONFIG.horizonY - yc * focal / z, s: 300 / z, z, behind: z0 < 1 };
}
const aimToX = (aim, Z) => aim * CONFIG.aimSpread * (Z + CONFIG.camera.nearZ);
// cast direction = mouse aim + the direction you're looking
const curAim = () => clamp(game.aim + Math.tan(game.look.yaw) / CONFIG.aimSpread, -4, 4);

function updateLook(dt) {
  const L = game.look, K = CONFIG.look, k = input.keys;
  const kx = (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0), ky = (k.KeyS ? 1 : 0) - (k.KeyW ? 1 : 0);
  if (kx || ky) lookBy(kx * K.keySpeed * dt / K.sensitivity, ky * K.keySpeed * 0.7 * dt / K.sensitivity);
  if (L.recenter && !L.dragging) {
    const r = Math.min(1, dt * 4);
    L.yaw -= L.yaw * r; L.pitch -= L.pitch * r;
    if (Math.abs(L.yaw) + Math.abs(L.pitch) < 0.002) { L.yaw = 0; L.pitch = 0; L.recenter = false; }
  }
  updateBasis();
}
function followCamera(dt, X, Z) {
  const tz = Math.max(0, Z - CONFIG.camera.followDist), k = Math.min(1, dt * 2.5);
  game.cam.z += (tz - game.cam.z) * k;
  game.cam.x += (X * 0.85 * clamp(tz / 200, 0, 1) - game.cam.x) * k;
}
function rodTip() {
  let y = 210, x = CONFIG.W / 2 + 40 + game.aim * 150;
  if (game.state === 'CHARGING') { y -= game.power * 90; x += game.power * 40; }
  if (game.state === 'REELING') y += game.tension * 40;
  return { x, y };
}
const boatOffset = () => game.cam.z * 1.4;   // boat slides out of view as the camera flies out
function addRipple(X, Z, k = 1) { game.ripples.push({ X, Z, k, t: 0 }); }

// ---------- 7. FISH AI ----------
function newWanderTarget(f) {
  const S = CONFIG.world.chunk;
  f.target = { X: f.home.X + rand(-0.6, 0.6) * S, Z: Math.max(40, f.home.Z + rand(-0.6, 0.6) * S) };
  f.tDepth = rand(4, Math.min(26, bedDepth(f.target.X, f.target.Z) - 3));
  f.timer = rand(3, 7);
}
function turnTo(f, want, maxStep) {
  const diff = Math.atan2(Math.sin(want - f.heading), Math.cos(want - f.heading));
  f.heading += clamp(diff, -maxStep, maxStep);
}
function swimTo(f, X, Z, speed, dt) {        // swims nose-first, turning smoothly
  const dx = X - f.X, dz = Z - f.Z, d = Math.hypot(dx, dz);
  turnTo(f, Math.atan2(dz, dx), dt * 3);
  f.cur += (Math.min(speed, d * 2) - f.cur) * Math.min(1, dt * 3);
  f.X += Math.cos(f.heading) * f.cur * dt; f.Z += Math.sin(f.heading) * f.cur * dt;
  return d;
}
function slideTo(f, p, speed, dt) {          // moves directly (used for darting / backing off)
  const dx = p.X - f.X, dz = p.Z - f.Z, d = Math.hypot(dx, dz), sp = Math.min(speed, d * 4);
  if (d > 0.01) { f.X += dx / d * sp * dt; f.Z += dz / d * sp * dt; }
  f.cur = sp; return d;
}
const faceHook = (f, dt) => turnTo(f, Math.atan2(f.fv.z, f.fv.x), dt * 4);
const hoverPt = f => ({ X: game.hookW.X - f.fv.x * (f.len / 2 + 14), Z: game.hookW.Z - f.fv.z * (f.len / 2 + 14) });
const contactPt = f => ({ X: game.hookW.X - f.fv.x * f.len * 0.48, Z: game.hookW.Z - f.fv.z * f.len * 0.48 });

function updateFish(f, dt) {
  f.phase += dt * (5 + f.cur * 0.15);
  f.depth += (f.tDepth - f.depth) * Math.min(1, dt * 1.2);
  const spd = f.sp.speed, hk = game.hookW;
  switch (f.mode) {
    case 'wander':
      f.timer -= dt;
      if (swimTo(f, f.target.X, f.target.Z, spd * 0.45, dt) < 10 || f.timer <= 0) newWanderTarget(f);
      break;
    case 'curious': {                       // swims over to look at the bait
      f.tDepth = hk.depth;
      const hp = hoverPt(f);
      if (swimTo(f, hp.X, hp.Z, spd * 0.7, dt) < 5) { f.mode = 'hover'; f.timer = rand(0.6, 1.6); }
      break;
    }
    case 'hover':                           // stares at the bait
      faceHook(f, dt); slideTo(f, hoverPt(f), 15, dt);
      if ((f.timer -= dt) <= 0) f.mode = f.nibblesLeft > 0 ? 'nibble' : 'bite';
      break;
    case 'nibble':                          // quick test-peck → bobber twitches
      faceHook(f, dt);
      if (slideTo(f, contactPt(f), spd * 1.4, dt) < 1.5) {
        game.dip = 0.5; f.nibblesLeft--; f.mode = 'backoff'; addRipple(game.bob.X, game.bob.Z, 0.5);
        addBubbles(hk.X, hk.Z, hk.depth, 3);
      }
      break;
    case 'backoff':
      faceHook(f, dt);
      if (slideTo(f, hoverPt(f), spd * 0.8, dt) < 2) { f.mode = 'hover'; f.timer = rand(0.4, 1.3); }
      break;
    case 'bite':                            // the real thing
      faceHook(f, dt);
      if (slideTo(f, contactPt(f), spd * 2.2, dt) < 1.5) {
        f.mode = 'holding';
        game.fish = { ...f.sp, size: f.size };
        addRipple(game.bob.X, game.bob.Z, 1.2);
        addBubbles(hk.X, hk.Z, hk.depth, 7);
        setState('BITE');
      }
      break;
    case 'holding': {
      const c = contactPt(f);
      f.X = c.X + Math.sin(game.time * 30) * 0.8; f.Z = c.Z; f.cur = 20;
      break;
    }
    case 'flee': {
      f.timer -= dt;
      const ax = f.X - hk.X, az = f.Z - hk.Z, d = Math.hypot(ax, az) || 1;
      f.tDepth = Math.min(45, bedDepth(f.X, f.Z) - 3);
      swimTo(f, f.X + ax / d * 100, f.Z + az / d * 100, spd * 3, dt);
      if (f.timer <= 0) { f.mode = 'wander'; newWanderTarget(f); }
      break;
    }
    // 'hooked' is driven by the REELING state
  }
}

function scareNear(X, Z, radius, except) {
  for (const f of game.fishes) {
    if (f === except || f.mode === 'hooked') continue;
    if (Math.hypot(f.X - X, f.Z - Z) < radius) { f.mode = 'flee'; f.timer = rand(2, 3.5); }
  }
}

function engageAFish() {
  const hk = game.hookW, R = CONFIG.world.interestRadius;
  const near = game.fishes.filter(f => f.mode === 'wander' && Math.hypot(f.X - hk.X, f.Z - hk.Z) < R);
  let f = near.length ? pickWeighted(near, x => x.sp.weight) : null;
  if (!f) {   // nobody close: a visitor swims in from outside
    const a = rand(0, Math.PI * 2);
    f = makeFish(pickFish(game.castDist), hk.X + Math.cos(a) * R * 1.2, Math.max(40, hk.Z + Math.sin(a) * R * 1.2), Math.random, null);
    game.fishes.push(f);
  }
  const dx = hk.X - f.X, dz = hk.Z - f.Z, d = Math.hypot(dx, dz) || 1;
  f.fv = { x: dx / d, z: dz / d };
  f.mode = 'curious'; f.nibblesLeft = randInt(...CONFIG.nibbles);
  game.engaged = f;
}

// ---------- 8. UPDATE (state machine) ----------
function update(dt) {
  game.time += dt; game.stateTime += dt;
  if (game.messageTimer > 0) game.messageTimer -= dt;
  game.ripples.forEach(r => r.t += dt * 0.7);
  game.ripples = game.ripples.filter(r => r.t < 1);
  for (const p of game.splash) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }
  game.splash = game.splash.filter(p => p.life > 0);
  if (input.left)  game.aim = clamp(game.aim - dt * 1.5, -1, 1);
  if (input.right) game.aim = clamp(game.aim + dt * 1.5, -1, 1);

  updateLook(dt);
  for (const bd of BIRDS) { bd.a += bd.sp * dt; bd.ph += dt * bd.flap; if (bd.a > 1.8) { bd.a = -1.8; bd.e = rand(0.1, 0.24); } }
  if (game.journalOpen) { if (input.pressed) game.journalOpen = false; input.pressed = input.released = false; return; }

  const C = CONFIG, b = game.bobber, hk = game.hookW;
  updateChunks();
  for (const f of game.fishes) updateFish(f, dt);

  // bobber on the water (WAITING / BITE / LOST)
  const placeBobber = () => {
    const p = project(game.bob.X, game.bob.Z, -game.dip * 4);
    b.x = p.x; b.y = p.y + Math.sin(game.time * 3) * 1.5 * p.s; b.s = p.s;
  };

  switch (game.state) {
    case 'IDLE':
    case 'CHARGING': {
      followCamera(dt, 0, 0);
      const tip = rodTip();
      b.x = tip.x + (game.state === 'IDLE' ? Math.sin(game.time * 2) * 6 : 0); b.y = tip.y + 70 + boatOffset(); b.s = 1.2;
      if (game.state === 'IDLE') {
        if (input.pressed) { game.power = 0; game.powerDir = 1; setState('CHARGING'); }
        break;
      }
      game.power += game.powerDir * C.cast.chargeSpeed * dt;
      if (game.power >= 1) { game.power = 1; game.powerDir = -1; }
      if (game.power <= 0) { game.power = 0; game.powerDir = 1; }
      if (input.released) {
        game.castDist = lerp(C.cast.minDist, C.cast.maxDist, game.power);
        game.castAim = curAim();
        game.look.recenter = !game.look.locked;     // swing the view back so you can follow the throw
        game.castX = aimToX(game.castAim, game.castDist);
        setState('CASTING');
      }
      break;
    }

    case 'CASTING': {   // camera chases the bobber through the air
      const t = clamp(game.stateTime / C.cast.flightTime, 0, 1);
      const Z = game.castDist * t, X = aimToX(game.castAim, Z);
      const Y = Math.sin(t * Math.PI) * (50 + game.castDist * 0.25) + (1 - t) * 60;
      followCamera(dt, X, Z);
      const p = project(X, Z, Y), tip = rodTip(), k = ease(clamp(t / 0.15, 0, 1));
      b.x = lerp(tip.x, p.x, k); b.y = lerp(tip.y + boatOffset(), p.y, k); b.s = lerp(1.2, p.s, k);
      if (t >= 1) {
        game.bob = { X, Z };
        Object.assign(hk, { X, Z, depth: C.world.hookDepth });
        addRipple(X, Z, 1.3);
        for (let i = 0; i < 24; i++) game.splash.push({ x: p.x, y: p.y, vx: rand(-90, 90) * p.s * 2, vy: rand(-260, -80) * p.s * 2, life: rand(0.4, 0.8) });
        scareNear(X, Z, 70);                    // the splash startles fish right underneath
        game.engaged = null; game.dip = 0;
        game.waitTimer = rand(...C.waitTime);
        setState('WAITING');
      }
      break;
    }

    case 'WAITING':
      followCamera(dt, game.castX, game.castDist);
      game.dip = Math.max(0, game.dip - dt * 1.4);
      hk.X = game.castX + Math.sin(game.time * 0.7) * 1.5; hk.depth = C.world.hookDepth + game.dip * 4;
      placeBobber();
      if (!game.engaged && (game.waitTimer -= dt) <= 0) engageAFish();
      if (input.pressed) {
        const e = game.engaged;
        if (e && e.mode !== 'wander') { toast(`Too early — you spooked the ${e.sp.name}!`); scareNear(hk.X, hk.Z, 300); setState('LOST'); }
        else { toast('Reeled in — nothing.'); toIdle(); }
      }
      break;

    case 'BITE':
      followCamera(dt, game.castX, game.castDist);
      game.dip = 1; hk.depth = C.world.hookDepth + 6;
      placeBobber();
      if (input.pressed) {
        const f = game.engaged;
        f.mode = 'hooked';
        scareNear(hk.X, hk.Z, 300, f);
        game.lineDist = game.castDist;
        game.tension = 0.3; game.slack = 0; game.pull = 0; game.pullTimer = 0; game.driftX = 0;
        setState('REELING');
      } else if (game.stateTime > C.biteWindow) {
        toast('It stole your bait… too slow!');
        scareNear(hk.X, hk.Z, 300);
        setState('LOST');
      }
      break;

    case 'REELING': {
      const f = game.engaged, fs = game.fish, R = C.reel;
      game.pullTimer -= dt;
      if (game.pullTimer <= 0) {
        const fighting = Math.random() < 0.4 + fs.strength * 0.4;
        game.pull = fighting ? fs.strength * rand(0.7, 1.3) : 0;
        game.pullDir = Math.random() < 0.5 ? -1 : 1;
        game.pullTimer = rand(0.4, 1.4);
      }
      if (input.down) {
        game.lineDist -= R.speed * dt * (1 - game.pull * 0.6);
        game.tension += (R.tensionUp + game.pull * 0.9) * dt;
        game.reelSpin += dt * 14;
      } else {
        game.lineDist += game.pull * 70 * dt;
        game.tension -= R.tensionDown * dt;
      }
      game.tension = clamp(game.tension, 0, 1);
      game.driftX = clamp(game.driftX + game.pullDir * game.pull * 90 * dt, -160, 160);
      if (Math.abs(game.driftX) >= 160) game.pullDir = -Math.sign(game.driftX);
      if (game.tension < 0.08) game.slack += dt; else game.slack = Math.max(0, game.slack - dt);

      // the hooked fish is dragged along the line toward the boat
      const along = Math.max(0, game.lineDist), prog = clamp(1 - along / game.castDist, 0, 1);
      const tX = game.castX * (along / game.castDist) + game.driftX * (along / game.castDist + 0.2);
      f.X += (tX - f.X) * Math.min(1, dt * 5); f.Z += (along - f.Z) * Math.min(1, dt * 5);
      turnTo(f, game.pull > 0.05 ? Math.atan2(1, game.pullDir * 0.8) : -Math.PI / 2, dt * 5);
      f.tDepth = lerp(C.world.hookDepth + 8, 4, prog);
      f.depth += (f.tDepth - f.depth) * Math.min(1, dt * 2);
      f.cur = 30 + game.pull * 80; f.phase += dt * game.pull * 25;
      game.bob = { X: f.X + Math.cos(f.heading) * f.len / 2, Z: f.Z + Math.sin(f.heading) * f.len / 2 };
      followCamera(dt, f.X, f.Z);
      const p = project(game.bob.X, game.bob.Z, -2);
      b.x = p.x; b.y = p.y; b.s = p.s;
      if (game.pull > 0.3 && Math.random() < dt * 8) { addRipple(f.X, f.Z, 0.6); addBubbles(f.X, f.Z, f.depth, 1); }
      Object.assign(hk, { X: game.bob.X, Z: game.bob.Z, depth: f.depth });

      const lose = msg => { f.mode = 'flee'; f.timer = 3; hk.X = f.X; hk.Z = f.Z; onFishLost(msg); };
      if (game.tension >= 1) lose('SNAP! The line broke.');
      else if (game.slack > R.slackLimit) lose('The line went slack — it slipped off the hook.');
      else if (game.lineDist > C.cast.maxDist + 60) lose('It swam out of range.');
      else if (game.lineDist <= R.catchDist) { game.fishes = game.fishes.filter(x => x !== f); onFishCaught(fs); }
      break;
    }

    case 'LOST':        // watch it swim off, then the camera glides back
      followCamera(dt, game.bob.X, game.bob.Z);
      game.dip = Math.max(0, game.dip - dt * 2);
      placeBobber();
      if (game.stateTime > (game.peekTarget ? 2.2 : 1.3)) toIdle();
      break;

    case 'RESULT':
      followCamera(dt, 0, 0);
      if (input.pressed && game.stateTime > 0.4) toIdle();
      break;
  }

  updatePeek(dt);
  input.pressed = input.released = false;
}

// Underwater camera: sits a little behind and level with the bait (or the hooked fish)
function updatePeek(dt) {
  if (!canPeek()) game.peekTarget = 0;
  const P = CONFIG.peek;
  game.peek = clamp(game.peek + (game.peekTarget ? 1 : -1) * dt * P.fadeSpeed, 0, 1);
  const hk = game.hookW, uc = game.ucam;
  const tX = hk.X, tZ = hk.Z - P.behind;
  const tD = clamp(hk.depth - 3, 3, bedDepth(tX, tZ) - 4);
  if (game.peek === 0) { uc.X = tX; uc.Z = tZ; uc.depth = tD; }
  const k = Math.min(1, dt * 3);
  uc.X += (tX - uc.X) * k; uc.Z += (tZ - uc.Z) * k; uc.depth += (tD - uc.depth) * k;
  for (const b of game.bubbles) { b.depth -= b.vy * dt; b.ph += dt * 5; }
  game.bubbles = game.bubbles.filter(b => b.depth > 0);
  for (const m of game.motes) { m.y -= dt * m.s * 3; m.x += Math.sin(game.time * 0.4 + m.y * 0.05) * dt * 4; if (m.y < 0) { m.y = CONFIG.H; m.x = Math.random() * CONFIG.W; } }
}
function addBubbles(X, Z, depth, n) {
  for (let i = 0; i < n; i++) game.bubbles.push({ X: X + rand(-2, 2), Z: Z + rand(-2, 2), depth: depth + rand(-1, 1), r: rand(0.4, 1.1), vy: rand(10, 18), ph: rand(0, 6) });
}

function toIdle() {
  for (const f of game.fishes) if (f.mode !== 'wander' && f.mode !== 'flee') { f.mode = 'wander'; newWanderTarget(f); }
  game.fishes = game.fishes.filter(f => f.chunk);   // visitors swim off
  game.engaged = null; game.fish = null; game.dip = 0;
  setState('IDLE');
}

// ---------- 10. HOOKS ----------
function onFishCaught(fish) {
  game.caught[fish.id] = (game.caught[fish.id] || 0) + 1;
  const isRecord = !game.best[fish.id] || fish.size > game.best[fish.id];
  if (isRecord) game.best[fish.id] = fish.size;
  game.coins += fish.value;
  game.lastCatch = { ...fish, isRecord };
  game.engaged = null;
  save();
  setState('RESULT');
  // TODO: play sound, trigger quests/achievements, add to a sellable inventory, etc.
}

function onFishLost(reason) {
  toast(reason);
  setState('LOST');
  // TODO: play sound, track stats, etc.
}

// ---------- 9. DRAW ----------
function draw() {
  const C = CONFIG;
  ctx.clearRect(0, 0, C.W, C.H);
  if (game.peek < 1) drawSurfaceScene();
  if (game.peek > 0) {
    ctx.save(); ctx.globalAlpha = ease(game.peek); drawUnderwater(); ctx.restore();
  }
  drawHUD();
  if (canPeek()) drawPeekButton();
  if (game.state === 'RESULT') drawResult();
  if (game.journalOpen) drawJournal();
}

function drawSurfaceScene() {
  const C = CONFIG;
  renderScene();
  drawRidges();
  drawBirds();
  drawFishes();
  if (game.state === 'WAITING' || game.state === 'BITE') drawHookLine();
  drawRipples();
  if (game.state === 'IDLE' || game.state === 'CHARGING') drawAimGuide();
  drawBobber();
  drawSplash();
  drawSunBloom();
  const off = boatOffset(), f = C.camera.focal;
  // the boat is part of the world, so it shifts as you look around; rod & hands stay with you
  const bx = -Math.tan(game.look.yaw) * f * 0.85, by = -Math.tan(game.look.pitch) * f * 0.85;
  if (off < C.H + 50) { ctx.save(); ctx.translate(bx, off + by); drawBoat(); ctx.restore(); }
  ctx.save(); ctx.translate(0, off);
  drawLine();
  if (off < C.H + 50) drawRodAndHands();
  ctx.restore();
  drawVignette();
}

// ----- underwater look -----
// Same procedural world, seen from a camera under the surface. Low-res ray shader for
// the surface-from-below (Snell's window) and the lake bed, then fish, line and bubbles on top.
const UW_W = 160, UW_H = 90;
const uwCanvas = document.createElement('canvas');
uwCanvas.width = UW_W; uwCanvas.height = UW_H;
const uwctx = uwCanvas.getContext('2d');
const uwImg = uwctx.createImageData(UW_W, UW_H);
const PEEK_BUTTON = { x: 960 - 176, y: 540 - 56, w: 160, h: 40 };

function projU(X, Z, depth) {
  const uc = game.ucam, F = CONFIG.peek.focal;
  const ax = X - uc.X, ay = uc.depth - depth, az = Z - uc.Z;      // y up
  const zc = ax * CB.fx + ay * CB.fy + az * CB.fz;
  if (zc < 6) return null;
  const xc = ax * CB.rx + az * CB.rz, yc = ax * CB.ux + ay * CB.uy + az * CB.uz;
  return { x: CONFIG.W / 2 + xc * F / zc, y: CONFIG.H / 2 - yc * F / zc, s: F / zc, zz: zc };
}

function renderUnderwaterBackdrop() {
  const C = CONFIG, F = CONFIG.peek.focal, uc = game.ucam, t = game.time, d = uwImg.data;
  let i = 0;
  for (let py = 0; py < UW_H; py++) {
    const dy = (C.H / 2 - (py + 0.5) * C.H / UW_H) / F;
    for (let px = 0; px < UW_W; px++) {
      const dx = ((px + 0.5) * C.W / UW_W - C.W / 2) / F;
      let wx = dx * CB.rx + dy * CB.ux + CB.fx, wy = dy * CB.uy + CB.fy, wz = dx * CB.rz + dy * CB.uz + CB.fz;
      const il = 1 / Math.sqrt(wx * wx + wy * wy + wz * wz); wx *= il; wy *= il; wz *= il;
      let r, g, b, dist;
      if (wy > 0.002) {                       // looking up at the underside of the surface
        const tt = uc.depth / wy, X = uc.X + wx * tt, Z = uc.Z + wz * tt;
        dist = tt;
        const rip = Math.sin(X * 0.12 + t * 2.1) + Math.sin(Z * 0.1 - t * 1.7) + Math.sin((X - Z) * 0.07 + t * 1.3);
        const win = clamp((wy - 0.6) * 12, 0, 1);                         // Snell's window: bright sky
        const glow = clamp((wy - 0.05) / 0.6, 0, 1) * (0.85 + rip * 0.08); // silvery underside
        r = lerp(50 + 110 * glow, 210, win); g = lerp(120 + 100 * glow, 238, win); b = lerp(140 + 95 * glow, 250, win);
      } else {                                // the lake bed
        const dn = Math.max(-wy, 0.002);
        let tt = (bedDepth(uc.X + wx * 60, uc.Z + wz * 60) - uc.depth) / dn;
        let X = uc.X + wx * tt, Z = uc.Z + wz * tt;
        tt = Math.max(0, bedDepth(X, Z) - uc.depth) / dn; X = uc.X + wx * tt; Z = uc.Z + wz * tt;
        dist = tt;
        const D = bedDepth(X, Z);
        const m = vnoise(X * 0.025, Z * 0.025), grain = 0.85 + vnoise(X * 0.15, Z * 0.15) * 0.3;
        const weed = clamp((m - 0.56) * 4, 0, 1), rock = clamp((0.32 - m) * 5, 0, 1), sand = 1 - weed - rock;
        let cs = Math.sin(X * 0.09 + t * 1.4) + Math.sin(Z * 0.11 - t * 1.1) + Math.sin((X + Z) * 0.06 + t * 0.8);
        cs = 1 + (cs > 1 ? (cs - 1) * 0.6 * Math.exp(-D * 0.02) : 0);
        const shade = Math.exp(-D * 0.012) * grain * cs;
        r = (190 * sand + 58 * weed + 96 * rock) * shade;
        g = (172 * sand + 96 * weed + 94 * rock) * shade;
        b = (120 * sand + 44 * weed + 88 * rock) * shade;
      }
      // fog: brighter looking up, darker looking down; red fades first
      const up = clamp(0.5 + wy * 2.5, 0, 1);
      const fr = lerp(8, 46, up), fg = lerp(48, 128, up), fb = lerp(68, 152, up);
      const ar = Math.exp(-dist * 0.016), ag = Math.exp(-dist * 0.008), ab = Math.exp(-dist * 0.006);
      d[i++] = r * ar + fr * (1 - ar); d[i++] = g * ag + fg * (1 - ag); d[i++] = b * ab + fb * (1 - ab); d[i++] = 255;
    }
  }
  uwctx.putImageData(uwImg, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(uwCanvas, 0, 0, C.W, C.H);
}

function drawUnderwater() {
  const C = CONFIG, t = game.time;
  renderUnderwaterBackdrop();

  // light shafts
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 6; k++) {
    const x0 = k * 190 - 60 + Math.sin(t * 0.25 + k * 1.7) * 50, w = 24 + (k % 3) * 16;
    const lg = ctx.createLinearGradient(0, 0, 0, C.H);
    lg.addColorStop(0, 'rgba(255,250,220,0.10)'); lg.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + w, 0); ctx.lineTo(x0 + w + 160, C.H); ctx.lineTo(x0 + 90, C.H); ctx.fill();
  }
  ctx.restore();

  // drifting specks
  ctx.fillStyle = 'rgba(220,240,255,0.3)';
  for (const m of game.motes) ctx.fillRect(m.x, m.y, m.s, m.s);

  // fish, far to near
  const list = [];
  for (const f of game.fishes) { const p = projU(f.X, f.Z, f.depth); if (p && p.zz < 700) list.push({ f, p }); }
  list.sort((a, b) => b.p.zz - a.p.zz);
  const hk = game.hookW, bob = projU(game.bob.X, game.bob.Z, 0), hook = projU(hk.X, hk.Z, hk.depth);
  let lineDrawn = false;
  const drawLineAndHook = () => {
    lineDrawn = true;
    if (!hook) return;
    ctx.strokeStyle = 'rgba(235,248,255,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(hook.x, hook.y);
    if (game.state === 'REELING' || game.state === 'LOST') ctx.lineTo(hook.x - (hk.X - game.ucam.X) * 0.2, -10);   // up toward the rod
    else if (bob) ctx.lineTo(bob.x, bob.y);
    ctx.stroke();
    if (game.state !== 'REELING' && game.state !== 'LOST') drawHookAndBait(hook.x, hook.y, hook.s);
  };
  for (const { f, p } of list) {
    if (!lineDrawn && p.zz < (hook ? hook.zz : 0)) drawLineAndHook();
    const c = Math.cos(f.heading), dir = c >= 0 ? 1 : -1, squash = Math.max(0.3, Math.abs(c));
    ctx.save(); ctx.globalAlpha *= Math.exp(-p.zz * 0.004);
    drawFishShape(p.x, p.y, f.len * p.s, dir, f.sp, f.phase, 1, squash);
    ctx.restore();
  }
  if (!lineDrawn) drawLineAndHook();

  // bobber seen from below
  if (bob && game.state !== 'REELING') {
    const rr = Math.max(2, 3.2 * bob.s);
    ctx.fillStyle = '#f2f2f2'; ctx.beginPath(); ctx.arc(bob.x, bob.y + game.dip * 2 * bob.s, rr, 0, Math.PI); ctx.fill();
    ctx.fillStyle = 'rgba(231,76,60,0.55)'; ctx.beginPath(); ctx.arc(bob.x, bob.y + game.dip * 2 * bob.s, rr, Math.PI, 0); ctx.fill();
  }

  // bubbles
  ctx.strokeStyle = 'rgba(230,248,255,0.75)'; ctx.lineWidth = 1;
  for (const b of game.bubbles) {
    const p = projU(b.X, b.Z, b.depth); if (!p) continue;
    ctx.beginPath(); ctx.arc(p.x + Math.sin(b.ph) * 2, p.y, Math.max(1, b.r * p.s), 0, Math.PI * 2); ctx.stroke();
  }

  // cues
  if (game.state === 'BITE' && hook) {
    ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 44px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('!', hook.x, hook.y - 40 + Math.sin(t * 30) * 3);
  } else if (game.state === 'WAITING' && game.dip > 0.2 && hook) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = 'italic 16px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('nibble…', hook.x + 60, hook.y - 20);
  }

  // vignette
  const vg = ctx.createRadialGradient(C.W / 2, C.H / 2, C.H * 0.35, C.W / 2, C.H / 2, C.W * 0.65);
  vg.addColorStop(0, 'rgba(0,10,20,0)'); vg.addColorStop(1, 'rgba(0,10,20,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, C.W, C.H);
}

function drawHookAndBait(x, y, s) {
  const k = clamp(s / 4, 0.6, 2.5), t = game.time;
  ctx.strokeStyle = '#d0d4d8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, y - 8 * k); ctx.lineTo(x, y + 3 * k); ctx.arc(x - 3.5 * k, y + 3 * k, 3.5 * k, 0, Math.PI * 0.9); ctx.stroke();
  ctx.strokeStyle = '#d9707e'; ctx.lineWidth = 3 * k; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y - 4 * k);
  ctx.quadraticCurveTo(x + (6 + Math.sin(t * 5) * 2) * k, y, x + k, y + 5 * k);
  ctx.quadraticCurveTo(x + (-6 + Math.sin(t * 6) * 3) * k, y + 10 * k, x + (-3 + Math.sin(t * 4) * 4) * k, y + 14 * k);
  ctx.stroke();
}

function drawPeekButton() {
  const b = PEEK_BUTTON, on = game.peekTarget === 1;
  ctx.fillStyle = on ? 'rgba(246,216,168,0.92)' : 'rgba(10,25,40,0.78)';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = '#f6d8a8'; ctx.lineWidth = 1.5; ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = on ? '#0b2233' : '#fff'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(on ? '▲ Back up  (E)' : '▼ Look under  (E)', b.x + b.w / 2, b.y + 25);
}

// ----- sky, mountains & water -----
// One ray per pixel from the camera (free-look yaw/pitch included):
//   up   → sky: golden-hour gradient, sun disk + glow, moving procedural clouds
//   down → water: wave normals → Fresnel mix of the reflection (sky, clouds, mountains, sun)
//          and the refraction (lake bed with caustics, colour-dependent absorption)
// Mountains, hills and the shore treeline are vector silhouettes drawn on top, so edges stay sharp,
// and the shader uses the same ridge function so they also appear mirrored in the water.
const WAVES = [
  { dir: [0.8, 0.6],   len: 120, amp: 2.0,  speed: 1.0 },
  { dir: [-0.5, 0.87], len: 70,  amp: 1.1,  speed: 1.3 },
  { dir: [0.2, 0.98],  len: 33,  amp: 0.5,  speed: 1.9 },
  { dir: [-0.9, 0.44], len: 17,  amp: 0.25, speed: 2.6 },
  { dir: [0.6, -0.8],  len: 9,   amp: 0.12, speed: 3.4 },
].map(w => ({ ...w, k: 2 * Math.PI / w.len }));
const SUN = (() => { const v = [0.43, 0.15, 1]; const l = Math.hypot(...v); return v.map(x => x / l); })();
const ETA = 1 / 1.33;   // air → water
const HORIZON_RGB = [248, 204, 158];

// Ridges are a height (in radians above the horizon) for every compass direction.
const RIDGES = [
  { base: 0.020, amp: 0.085, freq: 4.5, col: [118, 140, 168], haze: 0.55, step: 6 },               // distant mountains
  { base: 0.010, amp: 0.038, freq: 12,  col: [78, 108, 112],  haze: 0.35, step: 4 },               // hills
  { base: 0.004, amp: 0.010, freq: 38,  col: [36, 62, 48],    haze: 0.12, step: 2, trees: true },  // shore treeline
];
function ridgeH(a, i) {
  const R = RIDGES[i];
  let h = R.base + R.amp * vnoise(a * R.freq + i * 37.1, i * 5.3 + 0.5);
  if (R.trees) {                      // pointy conifer tops of varying height
    const q = a * 120, tri = 1 - 2 * Math.abs(q - Math.floor(q) - 0.5);
    h += 0.011 * tri * (0.4 + vnoise(a * 60, 9.1)) + 0.003 * vnoise(a * 400, 3.3);

}

// Ridge heights don't change, so the water shader reads them from a lookup table
const RIDGE_BINS = 4096, RIDGE_TAB = RIDGES.map((_, i) => {
  const t = new Float32Array(RIDGE_BINS);
  for (let j = 0; j < RIDGE_BINS; j++) t[j] = ridgeH((j / RIDGE_BINS) * 2 * Math.PI - Math.PI, i);
  return t;

const ridgeLookup = (a, i) => RIDGE_TAB[i][((a + Math.PI) * (RIDGE_BINS / (2 * Math.PI))) & (RIDGE_BINS - 1)];

let SR = 0, SG = 0, SB = 0;   // skyColour() writes here (no allocations in the hot loop)
function skyColour(x, y, z, octaves) {
  const h = 1 - y, h2 = h * h, h4 = h2 * h2, h8 = h4 * h4;
  const w = h4 * 0.35 + h8 * 0.65;                       // deep blue zenith → warm gold horizon
  let r = 54 + (HORIZON_RGB[0] - 54) * w, g = 106 + (HORIZON_RGB[1] - 106) * w, b = 188 + (HORIZON_RGB[2] - 188) * w;
  const sd = x * SUN[0] + y * SUN[1] + z * SUN[2];
  let s4 = 0;
  if (sd > 0) {
    const s2 = sd * sd; s4 = s2 * s2;
    const s16 = s4 * s4 * s4 * s4, s64 = s16 * s16 * s16 * s16;
    r += 70 * s16 + 45 * s4 * h4 + 130 * s64; g += 45 * s16 + 20 * s4 * h4 + 105 * s64; b += 8 * s16 + 55 * s64;
    if (sd > 0.9994) { r = 255; g = 250; b = 232; }
  }
  if (octaves > 0 && y > 0.008) {
    const k = 1 / y, tm = game.time, cx = x * k * 0.75 + tm * 0.012, cz = z * k * 0.75 + tm * 0.025;
    let n = vnoise(cx, cz) * 0.55;
    n += octaves > 1 ? vnoise(cx * 2.3 + 5.1, cz * 2.3) * 0.28 : 0.14;
    n += octaves > 2 ? vnoise(cx * 5.3, cz * 5.3 + 3.7) * 0.17 : 0.085;
    const cov = clamp((n - 0.5) * 4.5, 0, 1) * clamp((y - 0.008) * 10, 0, 1);
    if (cov > 0) {
      const thick = clamp((n - 0.6) * 4, 0, 1), lit = 1 + 0.7 * s4, gold = h8;
      const cr = (240 - 78 * thick) * lit + 20 * gold, cg = (226 - 80 * thick) * (1 + 0.45 * s4), cb = (216 - 56 * thick) - 30 * gold;
      r += (cr - r) * cov; g += (cg - g) * cov; b += (cb - b) * cov;
    }
  }
  SR = r; SG = g; SB = b;
}

// Resolution adapts to how long a frame takes (smaller = faster, softer)
const QUALITY = [[256, 144], [224, 126], [192, 108], [160, 90], [128, 72]];
const sceneCanvas = document.createElement('canvas');
const sctx = sceneCanvas.getContext('2d');
let sceneImg = null, qLevel = 1, qAvg = 6;
function setQuality(level) {
  qLevel = clamp(level, 0, QUALITY.length - 1);
  [sceneCanvas.width, sceneCanvas.height] = QUALITY[qLevel];
  sceneImg = sctx.createImageData(sceneCanvas.width, sceneCanvas.height);
}
setQuality(2);

function renderScene() {
  const t0 = performance.now();
  const C = CONFIG, f = C.camera.focal, cam = game.cam, t = game.time;
  const SW = sceneCanvas.width, SH = sceneCanvas.height, data = sceneImg.data;
  const camZ = cam.z - C.camera.nearZ;
  let i = 0;
  for (let py = 0; py < SH; py++) {
    const dy = (C.horizonY - (py + 0.5) * C.H / SH) / f;
    for (let px = 0; px < SW; px++) {
      const dx = ((px + 0.5) * C.W / SW - C.W / 2) / f;
      let wx = dx * CB.rx + dy * CB.ux + CB.fx, wy = dy * CB.uy + CB.fy, wz = dx * CB.rz + dy * CB.uz + CB.fz;
      const il = 1 / Math.sqrt(wx * wx + wy * wy + wz * wz); wx *= il; wy *= il; wz *= il;

      if (wy >= -0.0008) {                                   // ---- sky
        skyColour(wx, Math.max(wy, 0), wz, 3);
        data[i++] = SR; data[i++] = SG; data[i++] = SB; data[i++] = 255;
        continue;
      }
      // ---- water: where does the ray hit the surface?
      const tt0 = cam.h / -wy, X = cam.x + wx * tt0, Z = camZ + wz * tt0;
      const z = tt0 * Math.sqrt(wx * wx + wz * wz);
      let gx = 0, gz = 0;
      for (let k = 0; k < WAVES.length; k++) {
        const w = WAVES[k], a = 1 - z * w.k * 0.006; if (a <= 0) continue;   // fade out small waves far away
        const c = Math.cos(w.k * (w.dir[0] * X + w.dir[1] * Z) - w.speed * t * 1.6) * w.amp * w.k * a;
        gx += c * w.dir[0]; gz += c * w.dir[1];
      }
      const nl = 1 / Math.sqrt(gx * gx + 1 + gz * gz);
      const nx = -gx * nl, ny = nl, nz = -gz * nl;
      const vx = -wx, vy = -wy, vz = -wz;
      const ndv = Math.max(0.0001, nx * vx + ny * vy + nz * vz);
      const rx = 2 * ndv * nx - vx, rz = 2 * ndv * nz - vz;
      let ry = 2 * ndv * ny - vy; if (ry < 0.001) ry = 0.001;

      // reflection: mountains / hills / trees, otherwise the sky
      let sr, sg, sb, ridge = -1;
      if (ry < 0.11) { const az = Math.atan2(rx, rz); for (let L = 2; L >= 0; L--) if (ry < ridgeLookup(az, L)) { ridge = L; break; } }
      skyColour(rx, ry, rz, ridge >= 0 ? 0 : 1);
      if (ridge >= 0) {
        const c = RIDGES[ridge].col, hz = RIDGES[ridge].haze * 0.7 + 0.15;
        sr = c[0] * (1 - hz) + SR * hz; sg = c[1] * (1 - hz) + SG * hz; sb = c[2] * (1 - hz) + SB * hz;
      } else { sr = SR; sg = SG; sb = SB; }
      const om = 1 - ndv, om2 = om * om, F = 0.02 + 0.98 * om2 * om2 * om;

      // refraction → lake bed
      let wr = 10, wg = 56, wb = 76;
      const kk = 1 - ETA * ETA * (1 - ndv * ndv), tq = ETA * ndv - Math.sqrt(kk);
      const tx = -ETA * vx + tq * nx, ty = -ETA * vy + tq * ny, tz = -ETA * vz + tq * nz;
      const D = bedDepth(X, Z), sLen = D / Math.max(0.05, -ty);
      if (sLen < 500) {
        const bx = X + tx * sLen, bz = Z + tz * sLen;
        const m = vnoise(bx * 0.025, bz * 0.025), grain = 0.85 + vnoise(bx * 0.15, bz * 0.15) * 0.3;
        const weed = clamp((m - 0.56) * 4, 0, 1), rock = clamp((0.32 - m) * 5, 0, 1), sand = 1 - weed - rock;
        let cr = (190 * sand + 58 * weed + 96 * rock) * grain;
        let cg = (172 * sand + 96 * weed + 94 * rock) * grain;
        let cb = (120 * sand + 44 * weed + 88 * rock) * grain;
        let cs = Math.sin(bx * 0.09 + t * 1.4) + Math.sin(bz * 0.11 - t * 1.1) + Math.sin((bx + bz) * 0.06 + t * 0.8);
        cs = cs > 1 ? (cs - 1) * 0.6 * Math.exp(-D * 0.02) : 0;
        cr *= 1 + cs; cg *= 1 + cs; cb *= 1 + cs;
        const ar = Math.exp(-sLen * 0.04), ag = Math.exp(-sLen * 0.016), ab = Math.exp(-sLen * 0.011);
        wr = cr * ar + wr * (1 - ar); wg = cg * ag + wg * (1 - ag); wb = cb * ab + wb * (1 - ab);
      }
      let r = wr + (sr - wr) * F, g = wg + (sg - wg) * F, b = wb + (sb - wb) * F;
      if (ridge < 0) {                                      // sun glints
        const sd = rx * SUN[0] + ry * SUN[1] + rz * SUN[2];
        if (sd > 0.95) { const s = Math.pow(sd, 260) * 3.5; r += 255 * s; g += 236 * s; b += 196 * s; }
      }
      const haze = (1 - Math.exp(-z / 3200)) * 0.65;
      r += (HORIZON_RGB[0] - r) * haze; g += (HORIZON_RGB[1] - g) * haze; b += (HORIZON_RGB[2] - b) * haze;
      data[i++] = r; data[i++] = g; data[i++] = b; data[i++] = 255;
    }
  }
  sctx.putImageData(sceneImg, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(sceneCanvas, 0, 0, C.W, C.H);

  const ms = performance.now() - t0;
  qAvg = qAvg * 0.95 + ms * 0.05;
  if (qAvg > 11 && qLevel < QUALITY.length - 1) { setQuality(qLevel + 1); qAvg = 7; }
  else if (qAvg < 4 && qLevel > 0) { setQuality(qLevel - 1); qAvg = 7; }
}

function drawRidges() {
  const C = CONFIG, f = C.camera.focal;
  const tp = -CB.fy / CB.uy;                 // tan(pitch)
  const hy = C.horizonY - tp * f;            // screen y of the horizon
  if (hy < -20 || hy > C.H + 200) return;
  for (let i = 0; i < RIDGES.length; i++) {
    const R = RIDGES[i];
    ctx.beginPath();
    let minY = hy, first = true;
    for (let sx = -20; sx <= C.W + 20; sx += R.step) {
      const dx = (sx - C.W / 2) / f;
      const hx = dx * CB.rx + tp * CB.ux + CB.fx, hz = dx * CB.rz + tp * CB.uz + CB.fz;
      const a = Math.atan2(hx, hz), e = ridgeH(a, i);
      const ce = Math.cos(e), Dx = Math.sin(a) * ce, Dy = Math.sin(e), Dz = Math.cos(a) * ce;
      const yc = Dx * CB.ux + Dy * CB.uy + Dz * CB.uz, zc = Dx * CB.fx + Dy * CB.fy + Dz * CB.fz;
      if (zc <= 0.01) continue;
      const y = C.horizonY - yc / zc * f;
      if (first) { ctx.moveTo(sx, y); first = false; } else ctx.lineTo(sx, y);
      if (y < minY) minY = y;
    }
    ctx.lineTo(C.W + 20, hy + 1.5); ctx.lineTo(-20, hy + 1.5); ctx.closePath();
    const g = ctx.createLinearGradient(0, minY, 0, hy);
    const c = R.col, low = c.map((v, k) => Math.round(lerp(v, HORIZON_RGB[k], R.haze)));
    const top = c.map((v, k) => Math.round(lerp(v, HORIZON_RGB[k], R.haze * 0.35)));
    g.addColorStop(0, `rgb(${top})`); g.addColorStop(1, `rgb(${low})`);
    ctx.fillStyle = g; ctx.fill();
  }
}

const BIRDS = Array.from({ length: 5 }, (_, i) => ({ a: -0.6 + i * 0.22 + Math.random() * 0.1, e: 0.12 + Math.random() * 0.1, sp: 0.012 + Math.random() * 0.01, ph: Math.random() * 6, flap: 7 + Math.random() * 3 }));
function projectDir(x, y, z) {
  const zc = x * CB.fx + y * CB.fy + z * CB.fz;
  if (zc <= 0.02) return null;
  const f = CONFIG.camera.focal;
  return { x: CONFIG.W / 2 + (x * CB.rx + z * CB.rz) / zc * f, y: CONFIG.horizonY - (x * CB.ux + y * CB.uy + z * CB.uz) / zc * f };
}
function drawBirds() {
  ctx.strokeStyle = 'rgba(40,40,55,0.75)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  for (const b of BIRDS) {
    const ce = Math.cos(b.e), p = projectDir(Math.sin(b.a) * ce, Math.sin(b.e) + Math.sin(b.ph * 0.13) * 0.004, Math.cos(b.a) * ce);
    if (!p) continue;
    const w = Math.sin(b.ph) * 3;
    ctx.beginPath(); ctx.moveTo(p.x - 6, p.y - w); ctx.quadraticCurveTo(p.x - 3, p.y - 2 - w * 0.3, p.x, p.y);
    ctx.quadraticCurveTo(p.x + 3, p.y - 2 - w * 0.3, p.x + 6, p.y - w); ctx.stroke();
  }
}

function drawSunBloom() {
  const p = projectDir(SUN[0], SUN[1], SUN[2]);
  if (!p) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 260);
  g.addColorStop(0, 'rgba(255,236,190,0.35)'); g.addColorStop(0.25, 'rgba(255,210,150,0.12)'); g.addColorStop(1, 'rgba(255,200,140,0)');
  ctx.fillStyle = g; ctx.fillRect(p.x - 260, p.y - 260, 520, 520);
  ctx.restore();
}

function drawVignette() {
  const C = CONFIG;
  const vg = ctx.createRadialGradient(C.W / 2, C.H / 2, C.H * 0.45, C.W / 2, C.H / 2, C.W * 0.72);
  vg.addColorStop(0, 'rgba(20,10,0,0)'); vg.addColorStop(1, 'rgba(20,10,0,0.28)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, C.W, C.H);
}

// Fish seen from above, through the water: faded by Fresnel + depth, tinted toward water colour.
function drawFishes() {
  const list = game.fishes.map(f => ({ f, z: f.Z - game.cam.z })).filter(o => o.z > -100 && o.z < 1300);
  list.sort((a, b) => b.z - a.z || b.f.depth - a.f.depth);
  for (const o of list) drawFishTop(o.f);
}

function drawFishTop(f) {
  const C = CONFIG, cam = game.cam;
  const zc = f.Z - cam.z + C.camera.nearZ; if (zc < 20) return;
  const dxv = f.X - cam.x, cosi = cam.h / Math.sqrt(dxv * dxv + cam.h * cam.h + zc * zc);
  const om = 1 - cosi, F = 0.02 + 0.98 * om * om * om * om * om;
  const cosT = Math.sqrt(1 - ETA * ETA * (1 - cosi * cosi)), path = f.depth / cosT;
  const vis = (1 - F) * Math.exp(-path * 0.014);
  if (vis < 0.03) return;
  const Y = -f.depth * 0.6, c = Math.cos(f.heading), s = Math.sin(f.heading), L = f.len;
  const H = project(f.X + c * L * 0.5, f.Z + s * L * 0.5, Y);
  const T = project(f.X - c * L * 0.4, f.Z - s * L * 0.4, Y);
  const M = project(f.X + c * L * 0.08, f.Z + s * L * 0.08, Y);
  if (H.behind || T.behind || M.behind) return;
  let ax = H.x - T.x, ay = H.y - T.y; const al = Math.hypot(ax, ay) || 1; ax /= al; ay /= al;
  const px = -ay, py = ax, ppu = M.s * C.camera.focal / 300;
  const w = Math.max(0.8, L * 0.13 * ppu), wag = Math.sin(f.phase) * w * 0.9, tl = L * 0.22 * ppu;
  const TE = { x: T.x - ax * tl + px * wag, y: T.y - ay * tl + py * wag };
  const murk = 1 - Math.exp(-path * 0.012);
  const body = mix(f.sp.color, '#0a3a4e', murk), back = mix(mix(f.sp.color, '#000000', 0.45).replace(/rgb\((\d+),(\d+),(\d+)\)/, (_, r, g, b) => '#' + [r, g, b].map(v => (+v).toString(16).padStart(2, '0')).join('')), '#0a3a4e', murk);
  ctx.save(); ctx.globalAlpha = Math.min(0.92, vis);
  // soft shadow on the water column
  ctx.fillStyle = 'rgba(0,20,30,0.25)';
  ctx.beginPath(); ctx.ellipse((H.x + T.x) / 2 + 2, (H.y + T.y) / 2 + 3, Math.max(1, al * 0.55), Math.max(1, w * 1.1), Math.atan2(ay, ax), 0, Math.PI * 2); ctx.fill();
  // fins (flap with the stroke)
  const fin = Math.sin(f.phase * 0.7) * 0.3;
  ctx.fillStyle = body;
  for (const sgn of [-1, 1]) {
    const bx = M.x - ax * w * 0.4, by = M.y - ay * w * 0.4;
    ctx.beginPath(); ctx.moveTo(bx + px * w * sgn * 0.8, by + py * w * sgn * 0.8);
    ctx.lineTo(bx + px * w * sgn * (2 + fin) - ax * w * 1.2, by + py * w * sgn * (2 + fin) - ay * w * 1.2);
    ctx.lineTo(bx - ax * w * 1.4 + px * w * sgn * 0.6, by - ay * w * 1.4 + py * w * sgn * 0.6); ctx.fill();
  }
  // body + tail
  ctx.beginPath();
  ctx.moveTo(H.x, H.y);
  ctx.quadraticCurveTo(M.x + px * w * 1.4, M.y + py * w * 1.4, T.x + px * w * 0.3, T.y + py * w * 0.3);
  ctx.lineTo(TE.x + px * w * 0.9, TE.y + py * w * 0.9);
  ctx.lineTo(TE.x - ax * w * 0.3, TE.y - ay * w * 0.3);
  ctx.lineTo(TE.x - px * w * 0.9, TE.y - py * w * 0.9);
  ctx.lineTo(T.x - px * w * 0.3, T.y - py * w * 0.3);
  ctx.quadraticCurveTo(M.x - px * w * 1.4, M.y - py * w * 1.4, H.x, H.y);
  ctx.fill();
  // darker back
  ctx.strokeStyle = back; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(0.8, w * 0.7);
  ctx.beginPath(); ctx.moveTo(H.x - ax * w * 0.7, H.y - ay * w * 0.7); ctx.lineTo(T.x + ax * w * 0.2, T.y + ay * w * 0.2); ctx.stroke();
  // pattern
  if (f.sp.pattern === 'stripes' && w > 1.5) {
    ctx.strokeStyle = 'rgba(20,30,15,0.5)'; ctx.lineWidth = Math.max(0.8, w * 0.35);
    for (let k = 1; k <= 4; k++) {
      const q = k / 5, cx = lerp(T.x, H.x, q), cy = lerp(T.y, H.y, q);
      ctx.beginPath(); ctx.moveTo(cx + px * w * 0.9, cy + py * w * 0.9); ctx.lineTo(cx - px * w * 0.9, cy - py * w * 0.9); ctx.stroke();
    }
  }
  if (f.sp.pattern === 'spots' && w > 1.5) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (const [q, o] of [[0.65, 0.4], [0.4, -0.5], [0.25, 0.3]]) {
      ctx.beginPath(); ctx.arc(lerp(T.x, H.x, q) + px * w * o, lerp(T.y, H.y, q) + py * w * o, w * 0.45, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (f.sp.pattern === 'whiskers' && w > 1.5) {
    ctx.strokeStyle = back; ctx.lineWidth = 1;
    for (const sgn of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(H.x, H.y);
      ctx.quadraticCurveTo(H.x + ax * w * 1.5 + px * w * sgn, H.y + ay * w * 1.5 + py * w * sgn, H.x + ax * w * 0.5 + px * w * 2.5 * sgn, H.y + ay * w * 0.5 + py * w * 2.5 * sgn);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawHookLine() {
  const b = game.bobber, hk = game.hookW;
  const h = project(hk.X, hk.Z, -hk.depth * 0.6);
  ctx.save(); ctx.globalAlpha = 0.45;
  ctx.strokeStyle = 'rgba(230,245,255,0.8)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(h.x, h.y); ctx.stroke();
  ctx.fillStyle = '#d9707e';
  ctx.beginPath(); ctx.ellipse(h.x, h.y, Math.max(1.2, 3 * h.s), Math.max(1, 1.6 * h.s), Math.sin(game.time * 4) * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawRipples() {
  ctx.lineWidth = 1.5;
  for (const r of game.ripples) {
    const p = project(r.X, r.Z);
    for (let k = 0; k < 3; k++) {
      const tt = r.t - k * 0.12; if (tt <= 0) continue;
      const rad = (6 + tt * 50 * r.k) * p.s;
      ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - tt)})`;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, rad, rad * 0.28, 0, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

function drawSplash() {
  ctx.fillStyle = 'rgba(235,248,255,0.9)';
  for (const p of game.splash) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
}

function drawAimGuide() {
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let d = 0; d <= CONFIG.cast.maxDist; d += 40) {
    const p = project(aimToX(curAim(), d), d);
    if (p.behind) continue;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 3 * p.s, p.s, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (game.state === 'CHARGING') {
    const d = lerp(CONFIG.cast.minDist, CONFIG.cast.maxDist, game.power), p = project(aimToX(curAim(), d), d);
    ctx.strokeStyle = 'rgba(255,235,59,0.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 16 * p.s, 5 * p.s, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawBobber() {
  const b = game.bobber, r = Math.max(2, 9 * b.s);
  const onWater = ['WAITING', 'BITE', 'LOST', 'REELING'].includes(game.state);
  ctx.save();
  if (game.state === 'BITE' || game.state === 'REELING') ctx.globalAlpha = 0.45;   // pulled under
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(b.x, b.y, r, Math.PI, 0); ctx.fill();
  if (onWater) { ctx.fillStyle = 'rgba(20,70,100,0.75)'; ctx.fillRect(b.x - r - 1, b.y + r * 0.15, r * 2 + 2, r); }
  ctx.restore();
  if (game.state === 'BITE') {
    ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 40px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('!', b.x, b.y - 18 + Math.sin(game.time * 30) * 2);
  } else if (game.state === 'WAITING' && game.dip > 0.2) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = 'italic 15px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('nibble…', b.x, b.y - 16);
  }
}

function drawLine() {     // drawn inside the boat's translated space
  const tip = rodTip(), b = game.bobber, by = b.y - boatOffset();
  const sag = game.state === 'REELING' ? (1 - game.tension) * 50 : 30;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
  ctx.quadraticCurveTo((tip.x + b.x) / 2, Math.max(tip.y, by) + sag, b.x, by);
  ctx.stroke();
}

function drawBoat() {
  const C = CONFIG;
  ctx.fillStyle = '#6e4526';
  ctx.beginPath(); ctx.moveTo(150, C.H); ctx.lineTo(C.W / 2, C.H - 120); ctx.lineTo(C.W - 150, C.H); ctx.fill();
  const g = ctx.createLinearGradient(0, C.H - 100, 0, C.H);
  g.addColorStop(0, '#a87346'); g.addColorStop(1, '#7c5130');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(220, C.H); ctx.lineTo(C.W / 2, C.H - 100); ctx.lineTo(C.W - 220, C.H); ctx.fill();
  ctx.strokeStyle = 'rgba(60,35,15,0.5)'; ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(lerp(220, C.W / 2, i / 4.5), C.H); ctx.lineTo(C.W / 2, C.H - 100); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lerp(C.W - 220, C.W / 2, i / 4.5), C.H); ctx.lineTo(C.W / 2, C.H - 100); ctx.stroke();
  }
}

function drawRodAndHands() {
  const C = CONFIG, tip = rodTip();
  const base = { x: C.W / 2 + 170, y: C.H + 30 };
  const grip = { x: lerp(base.x, tip.x, 0.22), y: lerp(base.y, tip.y, 0.22) };
  const ctrl = { x: lerp(base.x, tip.x, 0.6), y: lerp(base.y, tip.y, 0.6) - 30 - (game.state === 'REELING' ? game.tension * 30 : 0) };
  ctx.strokeStyle = '#2b1d12'; ctx.lineCap = 'round';
  ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(grip.x, grip.y); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(grip.x, grip.y); ctx.quadraticCurveTo(ctrl.x, ctrl.y, tip.x, tip.y); ctx.stroke();
  const reel = { x: lerp(base.x, grip.x, 0.55) - 22, y: lerp(base.y, grip.y, 0.55) + 6 };
  ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(reel.x, reel.y, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(reel.x, reel.y, 12, 0, Math.PI * 2); ctx.fill();
  const hx = reel.x + Math.cos(game.reelSpin) * 26, hy = reel.y + Math.sin(game.reelSpin) * 26;
  ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(reel.x, reel.y); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.strokeStyle = '#2d4b73'; ctx.lineWidth = 46;
  ctx.beginPath(); ctx.moveTo(C.W + 20, C.H + 40); ctx.lineTo(grip.x + 30, grip.y + 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(C.W / 2 - 60, C.H + 60); ctx.lineTo(hx - 20, hy + 26); ctx.stroke();
  ctx.fillStyle = '#e8b88a';
  ctx.beginPath(); ctx.ellipse(grip.x + 6, grip.y + 6, 22, 17, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx - 4, hy + 6, 17, 14, 0.4, 0, Math.PI * 2); ctx.fill();
}

// Side-view fish (used on the catch card and in the journal)
function drawFishShape(x, y, L, dir, sp, phase, alpha, squash = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir * squash, 1); ctx.globalAlpha *= alpha;
  const baseA = ctx.globalAlpha;
  const wag = Math.sin(phase) * L * 0.07;
  ctx.fillStyle = mix(sp.color, '#000000', 0.25);
  ctx.beginPath(); ctx.moveTo(-L * 0.36, 0); ctx.lineTo(-L * 0.56, -L * 0.17 + wag); ctx.lineTo(-L * 0.5, wag); ctx.lineTo(-L * 0.56, L * 0.17 + wag); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(L * 0.14, -L * 0.17); ctx.quadraticCurveTo(-L * 0.04, -L * 0.33, -L * 0.22, -L * 0.11); ctx.lineTo(L * 0.14, -L * 0.13); ctx.fill();
  const g = ctx.createLinearGradient(0, -L * 0.22, 0, L * 0.2);
  g.addColorStop(0, mix(sp.color, '#000000', 0.4)); g.addColorStop(0.5, sp.color); g.addColorStop(1, mix(sp.color, '#ffffff', 0.6));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(L * 0.5, L * 0.02);
  ctx.bezierCurveTo(L * 0.42, -L * 0.2, 0, -L * 0.24, -L * 0.38, -L * 0.05);
  ctx.lineTo(-L * 0.38, L * 0.05);
  ctx.bezierCurveTo(0, L * 0.22, L * 0.42, L * 0.18, L * 0.5, L * 0.02);
  ctx.fill();
  ctx.save(); ctx.clip();
  if (sp.pattern === 'stripes') { ctx.fillStyle = 'rgba(30,40,20,0.35)'; for (let i = 0; i < 5; i++) ctx.fillRect(-L * 0.28 + i * L * 0.13, -L * 0.3, L * 0.05, L * 0.42); }
  if (sp.pattern === 'spots') { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(L * 0.05, -L * 0.08, L * 0.12, L * 0.07, 0.3, 0, Math.PI * 2); ctx.ellipse(-L * 0.22, 0, L * 0.08, L * 0.06, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(-L * 0.4, -L * 0.04, L * 0.9, L * 0.03);
  ctx.restore();
  ctx.fillStyle = mix(sp.color, '#ffffff', 0.3); ctx.globalAlpha = baseA * 0.8;
  ctx.beginPath(); ctx.moveTo(L * 0.22, L * 0.05); ctx.quadraticCurveTo(L * 0.1, L * 0.2 + wag * 0.5, L * 0.03, L * 0.13); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = baseA;
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = Math.max(1, L * 0.015);
  ctx.beginPath(); ctx.arc(L * 0.24, 0, L * 0.12, -1, 1); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(L * 0.37, -L * 0.05, Math.max(1.5, L * 0.04), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(L * 0.38, -L * 0.05, Math.max(1, L * 0.022), 0, Math.PI * 2); ctx.fill();
  if (sp.pattern === 'whiskers') {
    ctx.strokeStyle = 'rgba(40,30,20,0.8)'; ctx.lineWidth = 1.2;
    for (const k of [-1, 1]) { ctx.beginPath(); ctx.moveTo(L * 0.47, L * 0.04); ctx.quadraticCurveTo(L * 0.55, L * (0.1 + k * 0.04), L * 0.45 + wag * 0.3, L * (0.2 + k * 0.05)); ctx.stroke(); }
  }
  ctx.restore();
}

// ----- HUD & panels -----
function bar(x, y, w, h, v, color, label) {
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * v, h);
  if (label) { ctx.fillStyle = '#fff'; ctx.font = '13px system-ui'; ctx.textAlign = 'left'; ctx.fillText(label, x, y - 6); }
}

function drawHUD() {
  const C = CONFIG;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 4;
  drawHUDInner();
  ctx.restore();
}
function drawHUDInner() {
  const C = CONFIG;
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui';
  ctx.fillText(`🪙 ${game.coins}`, 16, 30);
  const total = Object.values(game.caught).reduce((a, b) => a + b, 0);
  ctx.font = '14px system-ui'; ctx.fillText(`Fish caught: ${total}   ·   J: journal`, 16, 52);
  if (['WAITING', 'BITE', 'REELING'].includes(game.state)) {
    ctx.fillText(`Water depth: ${(bedDepth(game.hookW.X, game.hookW.Z) / 10).toFixed(1)} m`, 16, 72);
  }

  const interested = game.engaged && game.engaged.mode !== 'wander';
  const hints = {
    IDLE: 'Aim with mouse / ← →  ·  hold SPACE / click to charge',
    CHARGING: 'Release to cast!',
    WAITING: interested ? 'A fish is checking out your bait… wait for the bite!' : 'Watch the fish around your bobber  ·  E: look under',
    BITE: 'BITE! Press now!',
    REELING: 'Hold to reel · release to ease tension',
  };
  const hint = hints[game.state] || '';
  ctx.textAlign = 'center'; ctx.font = 'bold 18px system-ui';
  ctx.fillStyle = '#fff'; ctx.fillText(hint, C.W / 2, 150);
  ctx.font = '13px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(game.look.locked ? 'Free-look on · F to release the mouse · C to recenter'
                                : 'Look around: right-drag or WASD · F: lock mouse · C: recenter', C.W / 2, 172);

  if (game.state === 'CHARGING') {
    const hue = lerp(120, 0, game.power);
    bar(16, C.H - 40, 220, 16, game.power, `hsl(${hue},80%,50%)`, 'Cast power');
  }
  if (game.state === 'REELING') {
    const t = game.tension;
    bar(C.W - 260, 30, 230, 16, t, t > 0.8 ? '#e74c3c' : t > 0.5 ? '#f39c12' : '#2ecc71', 'Line tension');
    bar(C.W - 260, 76, 230, 10, clamp(1 - game.lineDist / Math.max(game.castDist, 1), 0, 1), '#3498db', 'Reeled in');
    if (game.slack > 0.5) { ctx.fillStyle = '#ffeb3b'; ctx.font = '13px system-ui'; ctx.textAlign = 'left'; ctx.fillText('Line is slack!', C.W - 260, 108); }
  }
  if (game.messageTimer > 0) {
    ctx.globalAlpha = clamp(game.messageTimer, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(C.W / 2 - 230, 110, 460, 40);
    ctx.fillStyle = '#fff'; ctx.font = '16px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(game.message, C.W / 2, 136);
    ctx.globalAlpha = 1;
  }
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,25,40,0.92)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#f6d8a8'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
}

function drawResult() {
  const C = CONFIG, f = game.lastCatch;
  panel(C.W / 2 - 200, 110, 400, 240);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px system-ui'; ctx.fillText(`You caught a ${f.name}!`, C.W / 2, 155);
  drawFishShape(C.W / 2 + 10, 218 + Math.sin(game.time * 6) * 4, 130, 1, f, game.time * 8, 1);
  ctx.font = '17px system-ui'; ctx.fillStyle = '#fff';
  ctx.fillText(`${f.size} in   ·   +${f.value} 🪙`, C.W / 2, 290);
  if (f.isRecord) { ctx.fillStyle = '#ffeb3b'; ctx.fillText('★ New personal best!', C.W / 2, 315); }
  ctx.fillStyle = '#aaa'; ctx.font = '13px system-ui'; ctx.fillText('Press to continue', C.W / 2, 338);
}

function drawJournal() {
  const C = CONFIG;
  panel(140, 50, C.W - 280, C.H - 100);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 24px system-ui';
  ctx.fillText('Fishing Journal', C.W / 2, 90);
  FISH.forEach((f, i) => {
    const y = 140 + i * 62, known = game.caught[f.id];
    drawFishShape(225, y, 64, 1, known ? f : { color: '#333333', pattern: null }, 0, 1);
    ctx.textAlign = 'left'; ctx.fillStyle = known ? '#fff' : '#777'; ctx.font = 'bold 17px system-ui';
    ctx.fillText(known ? f.name : '???', 280, y - 4);
    ctx.font = '13px system-ui'; ctx.fillStyle = '#bbb';
    ctx.fillText(known ? `Caught ${known}× · best ${game.best[f.id]} in · worth ${f.value} 🪙`
                       : `Lives ${f.minDist / 10} m+ from the boat`, 280, y + 16);
  });
  ctx.textAlign = 'center'; ctx.fillStyle = '#aaa'; ctx.font = '13px system-ui';
  ctx.fillText('Press J or click to close', C.W / 2, C.H - 64);
}

// ---------- main loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
load();
requestAnimationFrame(loop);
</script>
</body>
</html>
